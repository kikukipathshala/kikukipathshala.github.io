<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opening Video...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

.logo{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    margin-bottom:12px;
}

p{
    color:#bbb;
    line-height:1.6;
    margin-bottom:24px;
}

img{
    width:100%;
    border-radius:12px;
    margin-bottom:24px;
    display:none;
}

.button{
    display:inline-block;
    background:#ff0000;
    color:white;
    text-decoration:none;
    padding:16px 28px;
    border-radius:10px;
    font-weight:bold;
    font-size:18px;
}

.small{
    margin-top:20px;
    color:#888;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">📺</div>

<h1>Opening YouTube...</h1>

<p>
If nothing happens automatically,
tap the button below.
</p>

<img id="thumbnail">

<a
id="openButton"
class="button"
href="#">
Open Video
</a>

<div class="small">
Kiku Ki Pathshala ❤️
</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const videoId=params.get("v");

const channelUrl="https://youtube.com/@kikukipathshala";

if(!videoId){

    window.location.replace(channelUrl);

}

const webUrl=`https://www.youtube.com/watch?v=${videoId}`;

const iosUrl=`youtube://www.youtube.com/watch?v=${videoId}`;

const androidIntent=
`intent://www.youtube.com/watch?v=${videoId}#Intent;scheme=https;package=com.google.android.youtube;end`;

document.getElementById("thumbnail").src=
`https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

document.getElementById("thumbnail").style.display="block";

document.getElementById("openButton").href=webUrl;

function openVideo(){

    if(/android/i.test(navigator.userAgent)){
        window.location=androidIntent;
    }
    else if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
        window.location=iosUrl;
    }

    setTimeout(()=>{
        window.location=webUrl;
    },1200);

}

window.onload=openVideo;

document
.getElementById("openButton")
.onclick=function(e){

    e.preventDefault();

    openVideo();

};

</script>

</body>
</html>
