<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening YouTube...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 30px;
        }

        p {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .button {
            display: inline-block;
            background: #ff0000;
            color: white;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: .2s;
        }

        .button:hover {
            background: #d60000;
        }

        .small {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo">▶️</div>

    <h1>Opening YouTube...</h1>

    <p>
        If the YouTube app doesn't open automatically,
        tap the button below.
    </p>

    <a class="button"
       id="openButton"
       href="https://youtube.com/@YOUR_CHANNEL_HANDLE">
        Open YouTube
    </a>

    <div class="small">
        If you're using Instagram's in-app browser,
        you may need to tap the button above.
    </div>

</div>

<script>

const handle = "kikukipathshala";

const webUrl = `https://youtube.com/@${handle}`;
const iosUrl = `youtube://www.youtube.com/@${handle}`;
const androidIntent =
`intent://www.youtube.com/@${handle}#Intent;scheme=https;package=com.google.android.youtube;end`;

document.getElementById("openButton").onclick = function (e) {

    e.preventDefault();

    if (/android/i.test(navigator.userAgent)) {
        window.location = androidIntent;
    }
    else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        window.location = iosUrl;
    }

    setTimeout(() => {
        window.location = webUrl;
    }, 1200);
};

// Attempt automatic open
window.onload = () => {

    if (/android/i.test(navigator.userAgent)) {
        window.location = androidIntent;
    }
    else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        window.location = iosUrl;
    }

    setTimeout(() => {
        window.location = webUrl;
    }, 1200);
};

</script>

</body>
</html>
