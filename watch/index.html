<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiku Ki Pathshala</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:12px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

h1{
    font-size:26px;
    margin-bottom:8px;
}

p{
    color:#cfcfcf;
    line-height:1.6;
    margin-bottom:16px;
}

img{
    width:100%;
    border-radius:14px;
    margin-bottom:16px;
    display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.button{
    display:inline-block;
    width:100%;
    background:#ff0000;
    color:white;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

.button:hover{
    background:#d90000;
}

.small{
    margin-top:24px;
    color:#888;
    font-size:14px;
}

.notice{
    display:none;
    margin-bottom:20px;
    padding:14px;
    background:#1f2937;
    border-radius:10px;
    color:#e5e5e5;
    font-size:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Opening YouTube</h1>

<p>
Watch this video in the YouTube app for the best experience.
</p>

<img id="thumbnail">

<a
id="openButton"
class="button"
href="#">
▶ Open in YouTube
</a>

<div class="small">
Kiku Ki Pathshala ❤️
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const videoId = params.get("v");

const channelUrl = "https://youtube.com/@kikukipathshala";

if(!videoId){
    window.location.replace(channelUrl);
}

const webUrl =
`https://www.youtube.com/watch?v=${videoId}`;

const iosUrl =
`youtube://www.youtube.com/watch?v=${videoId}`;

const androidIntent =
`intent://www.youtube.com/watch?v=${videoId}#Intent;scheme=https;package=com.google.android.youtube;end`;

const thumb =
document.getElementById("thumbnail");

thumb.src =
`https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

thumb.style.display = "block";

document
.getElementById("openButton")
.href = webUrl;

function openVideo(){

    if(/android/i.test(navigator.userAgent)){
        window.location = androidIntent;
    }
    else if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
        window.location = iosUrl;
    }

    setTimeout(()=>{
        window.location = webUrl;
    },1500);

}

document
.getElementById("openButton")
.addEventListener("click",function(e){

    e.preventDefault();

    openVideo();

});

const ua = navigator.userAgent;

const isInstagram =
/Instagram/i.test(ua);

if (!isInstagram) {
    openVideo();
}

</script>

</body>
</html>
